interface:
  display_name: "Маршрутизация подагентов"
  short_description: "Задачи, полномочия и модели подагентов"
  default_prompt: "Используй $ai-setup-subagents. Сначала найди цели в запросе, разговоре и применимых настройках. Покажи найденные цели и источники, спроси подтверждение для текущего запуска и дождись ответа. Если целей нет, уточни их после поиска. После подтверждения или исправления целей настрой подагентов, покажи предложение отдельно от текущей схемы и проверь соответствие результата этим целям."
