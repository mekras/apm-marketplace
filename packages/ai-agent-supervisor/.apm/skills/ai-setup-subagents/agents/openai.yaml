interface:
  display_name: "Маршрутизация подагентов"
  short_description: "Общие настройки, маршруты и полномочия подагентов"
  default_prompt: "Используй $ai-setup-subagents. Сначала найди цели в запросе, разговоре и применимых настройках. Покажи найденные цели и источники. Если целей нет, есть пробел или противоречие, уточни только недостающее решение. Затем настрой подагентов, покажи предложение отдельно от текущей схемы и проверь соответствие результата этим целям."
