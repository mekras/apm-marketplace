  - id: project_and_instruction_setup
    name: Настройка проекта и инструкций
    target_environments: [codex_cli, claude_code, hermes_agent]
    package_presence:
      status: included
      basis:
        - .apm/skills/ai-setup-project/SKILL.md#L1-L17
    declared_implementation:
      codex_cli:
        status: documented
        basis:
          - .apm/skills/ai-setup-project/SKILL.md#L62-L89
      claude_code:
        status: documented
        basis:
          - .apm/skills/ai-setup-project/SKILL.md#L84-L89
          - .apm/skills/ai-setup-project/SKILL.md#L151-L158
      hermes_agent:
        status: partial
        gap: Описаны установка, обнаружение навыков и точечная правка AGENTS.md с учётом защиты записи, но создание проекта целиком, остальные навыки и подагенты не проверены.
        basis:
          - .apm/skills/ai-setup-project/SKILL.md#L19-L28
          - .apm/skills/ai-agents-md-maintenance/references/maintenance-checklist.md#L85-L112
          - .apm/skills/ai-setup-apm/references/compatibility-history.md#L42-L51
