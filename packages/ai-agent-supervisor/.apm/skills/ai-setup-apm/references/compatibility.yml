schema_version: 2
scope:
  id: collection
  name: Вся коллекция навыков
environments:
  - id: codex_cli
    name: Codex CLI
    declared_support: true
    user_summary: Предусмотрены установка и работа навыков. Для анализа истории может потребоваться её экспорт.
  - id: claude_code
    name: Claude Code
    declared_support: true
    user_summary: Предусмотрены установка и работа навыков. Для анализа истории может потребоваться её экспорт.
  - id: hermes_agent
    name: Hermes Agent
    declared_support: true
    user_summary: Версия 2.6.13 содержит установку и обнаружение локальных навыков. Сценарий правки AGENTS.md в Hermes проверен только на локальном кандидате. Новые инструкции Hermes отдельного модельного испытания не проходили. Остальные возможности и подагенты Hermes не проверены.
capabilities:
  - id: collection_installation
    name: Установка коллекции
    target_environments: [codex_cli, claude_code, hermes_agent]
    package_presence:
      status: included
      basis:
        - apm.yml#L1-L17
        - .apm/skills/ai-setup-apm/SKILL.md#L30-L43
    declared_implementation:
      codex_cli:
        status: documented
        basis:
          - apm.yml#L1-L17
          - .apm/skills/ai-setup-apm/references/apm-collection-settings.md#L105-L143
      claude_code:
        status: documented
        basis:
          - apm.yml#L1-L17
          - .apm/skills/ai-setup-apm/references/apm-collection-settings.md#L130-L143
      hermes_agent:
        status: documented
        basis:
          - apm.yml#L1-L17
          - .apm/skills/ai-setup-apm/references/known-version-issues.md#L57-L91
  - id: skill_loading_and_availability
    name: Загрузка и доступность навыков
    target_environments: [codex_cli, claude_code, hermes_agent]
    package_presence:
      status: included
      basis:
        - apm.yml#L1-L17
        - .apm/skills/ai-setup-apm/references/apm-collection-settings.md#L141-L143
    declared_implementation:
      codex_cli:
        status: documented
        basis:
          - .apm/skills/ai-setup-apm/references/apm-collection-settings.md#L141-L143
          - .apm/skills/ai-setup-apm/references/apm-collection-settings.md#L364-L371
      claude_code:
        status: documented
        basis:
          - .apm/skills/ai-setup-apm/references/apm-collection-settings.md#L141-L143
          - .apm/skills/ai-setup-apm/references/apm-collection-settings.md#L364-L371
      hermes_agent:
        status: documented
        basis:
          - .apm/skills/ai-setup-apm/references/apm-collection-settings.md#L31-L64
