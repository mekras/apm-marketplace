    name: Создание и улучшение навыков
    target_environments: [codex_cli, claude_code, hermes_agent]
    package_presence:
      status: included
      basis:
        - .apm/skills/ai-skill-development/SKILL.md#L1-L17
    declared_implementation:
      codex_cli:
        status: documented
