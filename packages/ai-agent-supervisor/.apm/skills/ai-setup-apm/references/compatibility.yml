    effort_source: evals/compatibility/evidence/hermes-agent-2026-09-29/journal-excerpts.md#успешный-прогон
    conditions: Единственный реальный запуск в Linux/Docker на локальном кандидате коллекции с внешней изоляцией и заранее разрешённой правкой защищённого файла в отдельном HERMES_HOME
    method: Hermes Agent получил исходную задачу через stdin и --query-file -, загрузил установленный через APM навык и изменил только AGENTS.md в подготовленной копии проекта
