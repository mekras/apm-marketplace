          - .apm/skills/ai-skill-development/SKILL.md#L51-L75
      claude_code:
        status: documented
        basis:
          - .apm/skills/ai-skill-development/SKILL.md#L25-L31
          - .apm/skills/ai-skill-development/SKILL.md#L51-L75
      hermes_agent:
        status: not_established
        note: Общая процедура разработки есть, но рабочая загрузка навыка в Hermes не установлена.
  - id: subagent_setup_and_use
    name: Настройка и применение подагентов
    target_environments: [codex_cli, claude_code, hermes_agent]
    package_presence:
      status: included
      basis:
        - .apm/skills/ai-setup-subagents/SKILL.md#L1-L8
    declared_implementation:
      codex_cli:
        status: documented
        basis:
          - .apm/skills/ai-setup-subagents/references/routing-patterns.md#L170-L188
          - .apm/skills/ai-setup-subagents/references/operation-policy.md#L116-L148
      claude_code:
        status: documented
        basis:
          - .apm/skills/ai-setup-subagents/references/routing-patterns.md#L188-L195
          - .apm/skills/ai-setup-subagents/references/operation-policy.md#L331-L342
      hermes_agent:
        status: not_established
        note: Поставляемые материалы подтверждают только уровень APM, не рабочее применение подагентов.
  - id: work_analysis_and_result_evaluation
    name: Анализ работы и оценка результатов
    target_environments: [codex_cli, claude_code, hermes_agent]
    package_presence:
      status: included
      basis:
        - .apm/skills/ai-usage-analysis/SKILL.md#L1-L8
        - .apm/skills/ai-work-result-evaluation/SKILL.md#L1-L5
    declared_implementation:
      codex_cli:
        status: partial
        gap: ai-usage-analysis принимает доступную локальную историю или её экспорт, но не задаёт формат или адаптер нативной истории Codex CLI. Анализ требует совместимого экспорта или структурированного журнала. Общая оценка результата через ai-work-result-evaluation доступна без чтения истории.
        basis:
          - .apm/skills/ai-usage-analysis/SKILL.md#L25-L45
          - .apm/skills/ai-work-result-evaluation/SKILL.md#L16-L38
      claude_code:
        status: partial
        gap: ai-usage-analysis принимает доступную локальную историю или её экспорт, но не задаёт формат или адаптер нативной истории Claude Code. Анализ требует совместимого экспорта или структурированного журнала. Общая оценка результата через ai-work-result-evaluation доступна без чтения истории.
        basis:
          - .apm/skills/ai-usage-analysis/SKILL.md#L25-L45
          - .apm/skills/ai-work-result-evaluation/SKILL.md#L16-L38
      hermes_agent:
        status: not_established
        note: Не установлена доступная Hermes история сессий или рабочий след загрузки навыков.
checks:
  - id: hermes_apm_packaging_2_6_3
    date: 2026-09-18
    collection_version: 2.6.3
    environment:
      id: hermes_agent
      version: not_participated
      participation: not_participated
      tooling:
        apm_cli: 0.31.0
    capability: collection_installation
    conditions: Изолированный цикл блокировки зависимостей, установки и упаковки цели hermes
    method: Проверка блокировки, установки и упаковки коллекции через APM CLI
    verification_subject: packaging_tooling
    result: passed
    scope: Проверена только поставка APM для цели hermes. Hermes Agent не запускался и в испытании не участвовал. Загрузка и доступность навыков внутри Hermes не проверялись. Свидетельство — запись CHANGELOG, отдельный отчёт испытания в пакете не сохранён.
    evidence:
      - .apm/skills/ai-setup-apm/references/compatibility-history.md#L5-L12
  - id: codex_cli_ai_agents_md_maintenance_2_6_12
    date: 2026-09-28
    collection_version: 2.6.12
    environment:
      id: codex_cli
      version: 0.155.1
      participation: participated
      tooling:
        platform: Linux/Docker
        isolation: external Docker
        embedded_sandbox: disabled
    capability: project_and_instruction_setup
    model: gpt-5.6-luna
    effort: high
    conditions: Единственный реальный запуск в Linux/Docker с внешней изоляцией и отключённой встроенной песочницей Codex
    method: Codex CLI получил задачу через stdin и изменил только AGENTS.md в подготовленной копии проекта
    verification_subject: agent_runtime
    result: passed
    scope: Авторизация позволила выполнить этот запуск. Обновление токенов и длительная работа не проверялись. Фактические модель и усилие не подтверждены. Подтверждены только точечная правка AGENTS.md и сохранность исходного проекта. Чтение установленного навыка ai-agents-md-maintenance и действия по его процедуре наблюдались в событиях codex.jsonl item_1, item_4, item_5, item_11, item_13, item_14 и item_15. Полное соблюдение всех инструкций навыка не оценивалось. Доставка телеметрии не подтверждена. Наблюдались ошибки обновления списка моделей и ошибка Git в проекте без .git.
    evidence:
      - .apm/skills/ai-setup-apm/references/compatibility-history.md#L15-L27
      - evals/compatibility/evidence/codex-cli-2026-09-28/source-agents.md
      - evals/compatibility/evidence/codex-cli-2026-09-28/agents.diff
      - evals/compatibility/evidence/codex-cli-2026-09-28/journal-excerpts.md
