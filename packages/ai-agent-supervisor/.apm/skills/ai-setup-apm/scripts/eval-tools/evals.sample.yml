# Локальная конфигурация модельных evals (apm run evals).
#
# Это образец. При первом запуске evals он будет скопирован в evals.local.yml.

# Адаптеры моделей: имя адаптера -> команда. Контракт адаптера:
# <команда> <модель>, запрос на stdin, текст ответа на stdout.
adapters:
#  codex: tools/adapters/codex
#  claude: tools/adapters/claude

# Модели для применения навыков в формате адаптер:модель. Каждая запись
# прогоняется отдельно, результаты сопоставимы по одинаковым критериям.
# Здесь держите слабые модели: прогон должен проверять навык на слабом звене.
models:
  - adapter:sample-model
#  - another-adapter:sample-model

# Для fixture и result-scenarios перечислите здесь каждую модель из models.
# Это явная готовность адаптера выполнять задачи в APM_EVAL_WORKSPACE.
# Изменения проверяются по файлам, действия — по журналу APM_EVAL_TRACE,
# если адаптер его предоставляет. Одна запись здесь не доказывает выполнение.
workspace_models: []

# Модель-судья в формате адаптер:модель.
# Задавать обязательно. Назначайте сильную модель.
judge: adapter:judge-model

# Тайм-аут одного вызова адаптера в секундах.
timeout: 900

# Технические режимы baseline, skill, catalog повторяются столько раз.
# Их нельзя автоматически считать тремя условиями сравнительного эксперимента.
repetitions: 3
# Отдельный --comparison-plan использует это число повторов для каждого
# условия ordinary/minimal/collection. План задаётся отдельным файлом JSON.
# Число независимых вердиктов судьи, итог требует большинства.
judge_repetitions: 3
results_dir: eval-results

# Необязательная оценка стоимости, ставки указаны за миллион токенов.
# Нужны обе ставки и валюта. Ноль допустим только для явно бесплатного тарифа.
# При отсутствии фактических токенов оценивается лишь видимый текст.
# pricing:
#   adapter:sample-model:
#     currency: USD
#     input_per_million: 1.5
#     output_per_million: 2
