interface:
  display_name: "Настройка проекта под агентов"
  short_description: "Корневая настройка по шагам с подтверждением"
  default_prompt: "Используй $ai-setup-project, чтобы по шагам настроить проект под работу агентов: показывай каждое изменение и его пользу, запрашивай подтверждение по каждому шагу отдельно и применяй профильные навыки настройки и сопровождения инструкций, не повторяя их процедуру. Основной агент может выполнить эти навыки сам. Если политика индекса Git ещё не задана, предложи выбрать её и передай выбранное правило в навык сопровождения AGENTS.md. При отключённых подагентах пропускай их автоматическую настройку и проверку. В остальных случаях проверяй политику по явному запросу, при отсутствии политики и отказа. При истечении заданного срока только сообщи о давности и предложи проверку. Не запускай её без поручения пользователя, используй уже данное поручение без повторного разрешения."
