interface:
  display_name: "Настройка проекта или помощника"
  short_description: "Корневая настройка по шагам с подтверждением"
  default_prompt: "Используй $ai-setup-project, чтобы настроить проект или личный профиль Hermes. Для личного помощника без проекта сначала определи фактический профиль, его каталог и область каждого изменения. Проектные шаги применяй только к проекту. Проверяй загрузку инструкций в новом разговоре того же профиля, а недоступную проверку оставляй невыполненной. В обеих ветках: показывай каждое изменение и его пользу, запрашивай подтверждение по каждому шагу отдельно и применяй профильные навыки настройки и сопровождения инструкций, не повторяя их процедуру. Основной агент может выполнить эти навыки сам. В проектной ветке, если политика индекса Git ещё не задана, предложи выбрать её и передай выбранное правило в навык сопровождения AGENTS.md. При отключённых подагентах пропускай их автоматическую настройку и проверку. При проектной настройке проверяй политику по явному запросу, при отсутствии политики и отказа. При истечении заданного срока только сообщи о давности и предложи проверку. Не запускай её без поручения пользователя, используй уже данное поручение без повторного разрешения."
