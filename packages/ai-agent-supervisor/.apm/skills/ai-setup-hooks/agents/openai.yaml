interface:
  display_name: "Настройка хуков контроля правил"
  short_description: "Осторожная настройка хуков с явным согласием"
  default_prompt: "Используй $ai-setup-hooks, чтобы сначала рассмотреть альтернативы хуку, проверить его область применения в моей оснастке и объяснить последствия. Подключай конкретный хук только после моего согласия на эти условия. Не предлагай хук-напоминание вместо проверки и не зашивай конкретные правила или имена навыков в переносимый навык."
