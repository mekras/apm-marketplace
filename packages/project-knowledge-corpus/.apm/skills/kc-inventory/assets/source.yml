# Шаблон карточки источника.
# Скопируйте файл в data/<source>/source.yml.

id: SOURCE-ID
slug: source-slug
title: "Название источника"
status: draft # approved | draft | deprecated | blocked
priority: normal # high | normal | low
carrier_type: other # см. assets/source-carrier-types.yml
source_kind: other # см. assets/source-kinds.yml
long_source: false # true для книги, стандарта, большого документа или набора документации
# adapter is mandatory. Use a registered project adapter, or the portable
# agent-managed route below when the agent is explicitly allowed to obtain the
# material and update the source index.
adapter: agent
agent_route:
  mode: agent
  allowed_operations: [index, fetch, verify]
  # Required: replace with the project-relative directory of this source.
  # It must be narrow, relative and may not contain wildcards or '..'.
  write_scope: [knowledge/data/<source-slug>]
  instructions: "Опишите воспроизводимый маршрут получения и границы материала."
storage_strategy: index_only # full_copy | local_only | index_only | external_reference
processing_scope: metadata_only # metadata_only | selected_fragments | full | full_redacted
retrieval_mode: on_demand # synced | on_demand | external_reference | blocked
copy_policy: no_bulk_copy # full_copy_allowed | fragments_only | metadata_only | no_bulk_copy | local_only
allowed_use: "Точечная проверка с ссылкой на первоисточник."
requires_access_check: true

# Постоянные требования к доступу. Текущая готовность профиля хранится локально.
access_requirements:
  authorization_kind: account_session
  required_capabilities: [read_item]
  profile_name: source-reader # логическое имя без секрета
  interactive_setup: allowed # allowed | prohibited

# Условия использования задаются для конкретного действия и не заменяют
# проверку совпадения снимка.
use_policy:
  action: store_snapshot
  status: unknown # permitted | restricted | unknown | prohibited
  basis: "Условия для этого действия ещё не проверены."
  scope: "Один выбранный материал."
  checked_at: YYYY-MM-DD
  restrictions: []

url: "https://example.org/"
locator: "https://example.org/"
public_reference: "https://example.org/"
license_or_terms: unknown

access:
  default: "Текстовое описание доступа по умолчанию для единиц источника."
reliability: unchecked # canonical | official | working | media | personal | unchecked
stability: mutable # stable | mutable | unknown
refresh_policy: manual # none | manual | periodic | event-driven
refresh_interval_days:

# Rules for interpreting the provider index. They are project/source policy,
# not provider-specific keyword matching.
change_policy:
  technical_fields: [content_hash, etag, format, updated_at, retrieved_at]
  project_purpose: "Свяжите источник с назначением проекта."
  applicability: "Опишите область действия и ограничения."
  stability_policy: "Опишите, какие состояния выпуска считаются стабильными."
  require_primary_confirmation: true

retrieved_at: YYYY-MM-DD
# Дата ниже относится только к старому договору. Для нового снимка используйте
# verification.yml рядом с item.yml.
last_checked_at: YYYY-MM-DD
checked_by:
content_hash:
content_hash_algorithm:

# Для внешнего корпуса знаний без полной локальной копии раскомментируйте
# блок ниже и используйте его только вместе с source_kind: knowledge_corpus.
# external_corpus:
#   contract: portable_v1
#   use_as: peer
#   local_checkout: data/<source-slug>/external-corpus.local

# Для локальных книг и длинных документов.
original_filename:
format: # pdf | djvu | epub | scan | other
file_size_bytes:
page_count:
metadata_source:
extraction_tool:
extraction_status: # not_started | unavailable | local_text_ready | normalized_fragments_ready | blocked
publication_safety:

scope:
  includes: []
  excludes: []

known_limitations: []
processing_notes: []
