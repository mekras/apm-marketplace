# Классификатор технических типов носителя источника.
# Носитель отвечает на вопрос: как получить, разложить, хранить и
# нормализовать первичный материал.

classifier: source_carrier_types
contract_version: 1
field: carrier_type
default: other

rules:
  - "Выбирай носитель по технической форме материала, а не по его смысловой роли."
  - "Если источник совмещает несколько носителей, фиксируй основной носитель и уточняй дополнительные формы в processing_notes."
  - "Не подменяй носителем стратегию хранения: storage_strategy, retrieval_mode и copy_policy выбираются отдельно."
  - "Не подменяй носителем характер источника: source_kind выбирается по смысловой роли материала."
  - "Не выбирай носитель по месту доступа: локальный файл, закрытое хранилище или внешняя система описываются через locator, storage_strategy, retrieval_mode, copy_policy и access."
  - "Если материал оформлен для чтения человеком, выбирай document; если основная форма — машинно-структурированные записи, выбирай data_export; если перед чтением нужен OCR, расшифровка или визуальное описание, выбирай media."

values:
  document:
    title: "Документ"
    description: "Человекочитаемый оформленный материал: спецификация, регламент, отчет, руководство, статья, PDF, таблица в составе документа или презентация."
    typical_units:
      - file
      - section
      - page
      - table
      - fragment
    processing_focus:
      - "Зафиксировать формат, версию, дату получения, автора или владельца."
      - "Выбрать единицу нормализации: весь файл, раздел, страницу, таблицу или фрагмент."
      - "Проверить лицензию, условия публикации и допустимость хранения полного материала."
    storage_risks:
      - "Большой объем."
      - "Неясные права на полный текст."
      - "Потеря связи между извлеченным фрагментом и страницей или разделом."

  web_page:
    title: "Веб-страница"
    description: "Материал, доступный по опубликованному URL: страница документации, статья, новость, карточка, запись блога или раздел сервиса."
    typical_units:
      - url
      - page
      - heading
      - fragment
    processing_focus:
      - "Зафиксировать URL, дату обращения, стабильность адреса и условия использования."
      - "Решить, нужен ли снимок, индекс страниц или внешний маршрут доступа."
      - "Сохранять связь нормализованного фрагмента с исходным URL и датой обращения."
    storage_risks:
      - "Изменение страницы без явного версионирования."
      - "Запрет массового копирования."
      - "Потеря контекста при извлечении отдельного фрагмента."

  website:
    title: "Сайт или раздел сайта"
    description: "Множество связанных веб-страниц с общей структурой, владельцем и правилами доступа."
    typical_units:
      - site
      - section
      - page
      - index_entry
    processing_focus:
      - "Сначала учитывать структуру и индекс страниц, а не скачивать весь сайт без решения проекта."
      - "Определить правила выбора релевантных страниц для точечной обработки."
      - "Фиксировать частоту обновления и границы обхода."
    storage_risks:
      - "Слишком широкий объем."
      - "Быстрое устаревание локальной копии."
      - "Нарушение условий использования при массовом обходе."

  repository:
    title: "Репозиторий"
    description: "Хранилище кода, документации, настроек, тестов, данных и истории изменений."
    typical_units:
      - repository
      - branch
      - commit
      - tag
      - release
      - directory
      - file
      - pull_request
    processing_focus:
      - "Зафиксировать владельца, URL, лицензию, выбранную версию и область чтения."
      - "Ссылаться на конкретное состояние: commit, tag, release или снимок."
      - "Отделять содержимое файлов от истории изменений и обсуждений."
    storage_risks:
      - "Большой размер."
      - "Секреты или приватные данные в истории."
      - "Неустойчивые ссылки на ветки без закрепленного состояния."

  data_export:
    title: "Выгрузка данных"
    description: "Машинно-структурированный файл или набор файлов, полученный из системы: CSV, JSON, XML, архив с данными, таблица записей, база или результат запроса."
    typical_units:
      - file
      - archive
      - table
      - record
      - query_result
    processing_focus:
      - "Зафиксировать систему происхождения, время получения и параметры выгрузки."
      - "Описать структуру данных, объем и правила доступа."
      - "Отделять транспортную оболочку от данных, которые становятся первичным материалом."
    storage_risks:
      - "Чувствительные сведения."
      - "Неочевидные параметры запроса."
      - "Смешение технического журнала, отчета и исходных записей."

  transcript:
    title: "Стенограмма"
    description: "Текстовая фиксация речи: встреча, интервью, лекция, звонок, доклад, обсуждение или видео."
    typical_units:
      - recording
      - transcript
      - speaker_turn
      - timecoded_fragment
    processing_focus:
      - "Зафиксировать участников, дату, контекст разговора и качество распознавания."
      - "Сохранить связь с исходной записью или временем фрагмента."
      - "Перед извлечением утверждений очистить разметку говорящих, шум и неясные места."
    storage_risks:
      - "Персональные данные."
      - "Ошибки распознавания."
      - "Цитирование без контекста разговора."

  external_system:
    title: "Внешняя система"
    description: "Сервис или хранилище, где источник остается у владельца: трекер задач, CRM, облачная база знаний, форум, мессенджер или аналитическая система."
    typical_units:
      - system
      - project
      - space
      - section
      - record
      - thread
      - message
    processing_focus:
      - "Фиксировать правила доступа, учетную запись проекта, допустимый объем чтения и условия копирования."
      - "Выбирать индекс или внешний маршрут, если локальная копия запрещена, дорога или быстро устаревает."
      - "Получать материал точечно под конкретную задачу с проверкой доступа."
    storage_risks:
      - "Закрытый контур доступа."
      - "Запрет массовой загрузки."
      - "Секреты, токены, персональные данные и неустойчивые ссылки."

  media:
    title: "Медиафайл"
    description: "Аудио, видео, изображение или скан, где первичный материал нельзя читать как обычный текст или таблицу без OCR, расшифровки, описания или другого производного слоя."
    typical_units:
      - file
      - frame
      - page_image
      - audio_segment
      - video_segment
    processing_focus:
      - "Зафиксировать формат, длительность или размер, источник получения и производный способ извлечения текста."
      - "Отделять исходный медиафайл от OCR, расшифровки, описания и нормализованного текста."
      - "Проверять качество извлечения до утверждений и анализа влияния."
    storage_risks:
      - "Большой объем."
      - "Персональные данные в изображении, звуке или видео."
      - "Ошибки OCR, распознавания речи или описания изображения."

  other:
    title: "Другой носитель"
    description: "Техническая форма источника не укладывается в текущий классификатор."
    typical_units:
      - item
      - fragment
    processing_focus:
      - "Описать техническую форму в processing_notes."
      - "Зафиксировать, почему существующих значений недостаточно."
      - "Предложить расширение классификатора, если такой носитель повторяется."
    storage_risks:
      - "Неявные правила доступа и нормализации."
      - "Смешение носителя, характера источника и стратегии хранения."
