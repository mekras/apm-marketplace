# Необязательные локальные правила операционной проверки корпуса.
# Файл передаётся параметром --operational-policy.
# Правило обязано объяснять причину: оно не хранит значение найденного текста.
rules:
  - kind: personal-data
    path: data/example-source/documents/public-directory.md
    action: suppress
    reason: "Это опубликованный справочник организации; допустимость подтверждена."
