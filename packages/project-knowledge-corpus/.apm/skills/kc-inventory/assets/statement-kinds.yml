# Словарь видов утверждений корпуса.
# Используется для необязательного поля statements[].kind.

values:
  fact:
    label: "факт"
    description: "Прямое утверждение, которое явно содержится в источнике."
  observation:
    label: "наблюдение"
    description: "Наблюдение составителя о материале, структуре или свойствах источника."
  inference:
    label: "вывод"
    description: "Интерпретация или вывод из источника, требующий отдельной проверки."
  limitation:
    label: "ограничение"
    description: "Оговорка, граница применимости, лицензии, доступа или публикации."
