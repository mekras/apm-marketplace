# Классификатор смысловых видов источника.
# Вид отвечает на вопрос: как интерпретировать материал, какой вес придавать
# утверждениям и какие ограничения учитывать при переносе выводов.

classifier: source_kinds
contract_version: 1
field: source_kind
default: other

rules:
  - "Выбирай вид по смысловой роли источника, а не по технической форме носителя."
  - "Один и тот же носитель может иметь разные виды: веб-страница может быть регламентом, справочником, новостью, обсуждением или журналом изменений."
  - "Вид источника не отменяет проверку доступа, лицензии, актуальности и области применения."
  - "Если материал содержит несколько смысловых слоев, фиксируй основной вид и уточняй дополнительные роли в processing_notes."

values:
  normative:
    title: "Нормативный или обязательный источник"
    description: "Регламент, политика, стандарт, закон, договор, инструкция или другое правило, обязательное для проекта или организации."
    use_for:
      - "Ограничения и обязательные требования."
      - "Проверка соответствия решения установленным правилам."
      - "Обоснование запретов, обязанностей и процедур."
    statement_rules:
      - "Отделять точную норму от пересказа и интерпретации."
      - "Сохранять ссылку на раздел, пункт, версию и дату доступа."
      - "Проверять, действует ли документ и относится ли он к проекту."
    cautions:
      - "Не переносить норму за пределы ее области применения."
      - "Не смешивать обязательное правило с рекомендательной практикой."
    evidence_weight: high

  reference:
    title: "Справочник"
    description: "Материал, который дает определения, термины, классификации, справочные параметры или навигацию по предметной области."
    use_for:
      - "Термины и определения."
      - "Классификации и перечни."
      - "Навигация по предметной области."
    statement_rules:
      - "Извлекать определения и связи терминов как справочные утверждения."
      - "Проверять владельца справочника и дату актуальности."
      - "Не считать справочную статью проектным решением без дополнительного основания."
    cautions:
      - "Справочник может описывать область, но не предписывать поведение проекта."
      - "Часто нужны дополнительные источники для требований и решений."
    evidence_weight: medium

  knowledge_base:
    title: "База знаний"
    description: "Множество статей, карточек, страниц или записей, которые накапливают рабочие знания организации, продукта или сообщества."
    use_for:
      - "Поиск релевантных единиц знания."
      - "Выявление устойчивых практик и терминов."
      - "Сбор контекста перед точечной проверкой."
    statement_rules:
      - "Сначала индексировать структуру, затем получать и обрабатывать выбранные единицы."
      - "Отделять утвержденные статьи от черновиков, заметок и устаревших страниц."
      - "Фиксировать владельца раздела и частоту обновления."
    cautions:
      - "Индекс базы знаний не подтверждает факты сам по себе."
      - "Статьи могут устаревать без явного изменения статуса."
    evidence_weight: medium

  knowledge_corpus:
    title: "Корпус знаний"
    description: "Внутренний или внешний корпус знаний, построенный по тем же правилам: источники, индексы, нормализованные артефакты, утверждения и отчёты влияния."
    use_for:
      - "Повторное использование уже собранных источников, утверждений и отчётов как проверяемого рабочего слоя."
      - "Подключение внешнего корпуса как peer-слоя без полной копии в текущий проект."
      - "Поиск релевантных источников, понятий и открытых вопросов перед новой обработкой."
    statement_rules:
      - "Использовать корпус как навигационный и рабочий слой наравне с локальным корпусом проекта."
      - "Для значимых выводов сохранять трассировку до исходного источника и артефакта внутри корпуса, а не только до карточки внешнего корпуса."
      - "Фиксировать договор внешнего корпуса, маршрут доступа и ограничение на массовое копирование."
    cautions:
      - "Не копировать внешний корпус целиком в проект-потребитель без отдельного решения."
      - "Не считать сам факт подключения внешнего корпуса доказательством содержания без проверки его артефактов."
      - "Проверять актуальность, доступ и правила публикации каждого используемого фрагмента."
    evidence_weight: medium

  requirement:
    title: "Требование"
    description: "Материал, который описывает нужное поведение, ограничение, критерий приемки, пользовательскую потребность или бизнес-правило."
    use_for:
      - "Формулирование требований."
      - "Проверка полноты и трассировки требований."
      - "Анализ влияния изменений источника на продуктовые решения."
    statement_rules:
      - "Отделять потребность, требование, ограничение, решение и критерий приемки."
      - "Сохранять статус требования и источник утверждения."
      - "Проверять заинтересованную сторону и область применения."
    cautions:
      - "Не превращать пример или пожелание в обязательное требование без подтверждения."
      - "Не смешивать требование с вариантом реализации."
    evidence_weight: high

  decision_record:
    title: "Запись решения"
    description: "ADR, протокол, issue, комментарий, письмо или другой материал, фиксирующий принятое проектное, архитектурное или организационное решение."
    use_for:
      - "Понимание действующих решений и их причин."
      - "Проверка, не противоречит ли новое изменение уже принятому решению."
      - "Анализ последствий изменения решения."
    statement_rules:
      - "Фиксировать дату, участников, статус и область решения."
      - "Отделять принятое решение от обсуждавшихся альтернатив."
      - "Проверять, не отменено ли решение более поздним источником."
    cautions:
      - "Обсуждение вокруг решения не равно самому решению."
      - "Старое решение может быть действующим, устаревшим или замененным."
    evidence_weight: high

  discussion:
    title: "Обсуждение"
    description: "Форумная тема, чат, комментарии, переписка, встреча или issue, где участники обмениваются мнениями, вопросами и рабочими наблюдениями."
    use_for:
      - "Выявление проблем, потребностей, вариантов и контекста."
      - "Поиск сигналов для дальнейшей проверки."
      - "Понимание мотивов и ограничений участников."
    statement_rules:
      - "Отделять мнение, предложение, факт, вопрос и принятое решение."
      - "Фиксировать автора или роль, дату и контекст."
      - "Проверять существенные факты по более надежному источнику перед переносом в проектные выводы."
    cautions:
      - "Не считать обсуждение утвержденным решением."
      - "Не обобщать единичное мнение как правило для всей области."
      - "Следить за персональными данными и приватностью участников."
    evidence_weight: low

  operational_record:
    title: "Операционная запись"
    description: "Журнал событий, заявка, тикет, отчет о работе, запись инцидента, регистрационная карточка или другой след фактической операции."
    use_for:
      - "Факты о событиях, состояниях и действиях."
      - "Анализ процессов и повторяющихся проблем."
      - "Проверка, что действие действительно происходило."
    statement_rules:
      - "Фиксировать время, систему происхождения, параметры выборки и статус записи."
      - "Отделять факт события от причины, оценки и последующего вывода."
      - "Проверять полноту выборки перед статистическими выводами."
    cautions:
      - "Операционная запись может быть неполной или исправленной позже."
      - "Часто содержит чувствительные данные."
    evidence_weight: medium

  dataset:
    title: "Набор данных"
    description: "Структурированные данные, таблица, выгрузка, база, корпус записей или результат запроса, используемые как источник наблюдений."
    use_for:
      - "Структурированные факты и измерения."
      - "Анализ распределений, частоты и связей."
      - "Проверка гипотез на массиве записей."
    statement_rules:
      - "Фиксировать схему, параметры выгрузки, размер, период и ограничения выборки."
      - "Не делать выводы за пределами выборки."
      - "Отделять сырые данные от нормализованных и агрегированных представлений."
    cautions:
      - "Ошибки схемы или отбора искажают выводы."
      - "Агрегации могут скрывать важные исключения."
    evidence_weight: medium

  research:
    title: "Исследование или аналитический отчет"
    description: "Материал с анализом, выводами, методикой, результатами исследования, обзором или экспертной оценкой."
    use_for:
      - "Контекст и обоснование гипотез."
      - "Методики и выводы, которые можно проверить по источникам исследования."
      - "Сравнение подходов и рисков."
    statement_rules:
      - "Отделять первичные данные, методику, наблюдения и выводы автора."
      - "Фиксировать источник данных, ограничения метода и дату публикации."
      - "Проверять важные выводы по первичным источникам, если они доступны."
    cautions:
      - "Вывод автора не равен первичному факту."
      - "Методика и выборка могут не подходить к текущему проекту."
    evidence_weight: medium

  article:
    title: "Статья"
    description: "Самостоятельный авторский материал: публикация, заметка, обзор, блоговая запись, разбор, колонка или материал в медиа."
    use_for:
      - "Контекст и авторская интерпретация темы."
      - "Описание практики, события, проблемы или подхода."
      - "Поиск ссылок на первичные источники и дополнительные основания."
    statement_rules:
      - "Отделять факты, мнение автора, редакционную позицию и пересказ чужих источников."
      - "Фиксировать автора, площадку, дату публикации и дату обращения."
      - "Проверять существенные факты по первичным источникам, если они доступны."
    cautions:
      - "Статья не является нормативным правилом или проектным решением сама по себе."
      - "Авторская оценка может быть спорной, устаревшей или неполной."
    evidence_weight: medium

  book:
    title: "Книга"
    description: "Цельное длинное произведение или издание: монография, учебник, руководство, методическое пособие, справочник или сборник."
    use_for:
      - "Глубокое объяснение понятий, методик и предметной области."
      - "Выявление устойчивых принципов, терминов и практик."
      - "Получение проверяемых фрагментов для дальнейшего анализа."
    statement_rules:
      - "Фиксировать автора, название, издание, год, страницы или главы."
      - "Отделять позицию автора, пример, методику, определение и обязательное правило."
      - "Для публичного корпуса соблюдать ограничения хранения полного текста и цитирования."
    cautions:
      - "Книга может быть источником знаний, но не обязательно источником требований проекта."
      - "Полный текст книги часто нельзя хранить в открытом Git без явного права."
      - "Старое издание может не отражать текущее состояние области."
    evidence_weight: medium

  training_material:
    title: "Учебный материал"
    description: "Книга, курс, лекция, руководство, урок или методическое пособие, созданные для обучения."
    use_for:
      - "Объяснение понятий и практик."
      - "Получение методических рекомендаций."
      - "Поиск примеров и типовых ошибок."
    statement_rules:
      - "Отделять объяснение, пример, рекомендацию и обязательное правило."
      - "Проверять актуальность материала и применимость к проекту."
      - "Соблюдать ограничения цитирования и публикации фрагментов."
    cautions:
      - "Учебный пример не является требованием проекта."
      - "Полный текст книги или курса часто нельзя публиковать в открытом корпусе."
    evidence_weight: medium

  source_code:
    title: "Исходный код"
    description: "Код, тесты, настройки, скрипты, схемы или другие исполняемые и проверяемые артефакты проекта."
    use_for:
      - "Проверка фактического поведения."
      - "Выявление интерфейсов, зависимостей и технических ограничений."
      - "Связь документации с реализацией."
    statement_rules:
      - "Ссылаться на конкретный файл, версию, commit или release."
      - "Отделять наблюдаемое поведение кода от намерения автора."
      - "Проверять выводы тестами или запуском, если это важно и возможно."
    cautions:
      - "Код может не отражать желаемое или документированное поведение."
      - "Ветка без закрепленного состояния может измениться."
    evidence_weight: high

  changelog:
    title: "Журнал изменений"
    description: "Запись изменений продукта, пакета, API, данных или документации по версиям или датам."
    use_for:
      - "Понимание внешне значимых изменений."
      - "Поиск миграционных действий и точек обновления."
      - "Проверка, когда появилась или изменилась возможность."
    statement_rules:
      - "Фиксировать версию, дату, раздел и статус выпуска."
      - "Отделять внешне значимое изменение от внутренней механики коммита."
      - "Проверять критичные изменения по коду, документации или выпуску."
    cautions:
      - "Журнал изменений может быть неполным."
      - "Запись о планах в разделе невыпущенного не равна выпущенному поведению."
    evidence_weight: medium

  media_evidence:
    title: "Медиа-свидетельство"
    description: "Фото, видео, аудио, скан или другое медиа, используемое как свидетельство состояния, события или содержания."
    use_for:
      - "Подтверждение наблюдаемого состояния."
      - "Извлечение текста, речи или визуальных признаков."
      - "Сопоставление с другими источниками."
    statement_rules:
      - "Сохранять связь с исходным файлом, временем, кадром, страницей или сегментом."
      - "Отделять наблюдаемый признак от интерпретации."
      - "Проверять качество OCR, распознавания речи или визуального описания."
    cautions:
      - "Медиа может содержать персональные данные."
      - "Автоматическое извлечение может ошибаться."
    evidence_weight: medium

  other:
    title: "Другой вид источника"
    description: "Смысловая роль источника не укладывается в текущий классификатор."
    use_for:
      - "Временная фиксация источника до уточнения классификатора."
    statement_rules:
      - "Описать смысловую роль в processing_notes."
      - "Зафиксировать, почему существующих видов недостаточно."
      - "Предложить расширение классификатора, если такой вид повторяется."
    cautions:
      - "Не использовать other как способ избежать интерпретации источника."
      - "Не переносить выводы без явных правил доверия и проверки."
    evidence_weight: unknown
