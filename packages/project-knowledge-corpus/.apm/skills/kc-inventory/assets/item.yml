# Шаблон единицы источника.
# Скопируйте файл в data/<source>/<units>/<unit>/item.yml.

id: SOURCE-ID-ITEM
title: "Название или краткая тема"
url: "https://example.org/item"
date_published: YYYY-MM-DD
access: "Текстовое описание доступа к этой единице источника."

status: candidate # candidate | confirmed | rejected | archived
workflow_stage: indexed
# Для workflow_stage: blocked укажите один код из закрытого перечня договора.
# blocker_code: owner_decision_required
# action_required: "Выбрать один из двух несовместимых вариантов применения."
# automatic_attempts:
#   - "Проверено безопасное проектное умолчание."
#   - "Случай передан в класс усиленной проверки."
long_source: false # true если эта единица сама является длинным документом
processing_scope: metadata_only # metadata_only | selected_fragments | full | full_redacted
retrieval_mode: on_demand # synced | on_demand | external_reference | blocked
copy_policy: no_bulk_copy # full_copy_allowed | fragments_only | metadata_only | no_bulk_copy | local_only
allowed_use: "Точечная проверка с ссылкой на первоисточник."
requires_access_check: true

# files.local — неотслеживаемые файлы этой единицы рядом с её артефактами.
# Маркер в имени: постоянное сырьё — *.local.* (запись.local.mp4),
# временный рабочий файл — *.tmp.*. Оба исключены из Git и не требуют
# вложенной папки.
files:
  tracked:
    - message.md
  local:
    - запись.local.mp4
    - attachment.tmp.bin

known_limitations: []
processing_notes: []
