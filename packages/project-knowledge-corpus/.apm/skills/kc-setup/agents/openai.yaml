interface:
  display_name: "kc-setup"
  short_description: "Настройка проекта на использование корпуса знаний"
  default_prompt: "Используй $kc-setup, чтобы настроить корпус знаний проекта, включая инструкции агента, допуск материалов, место проектных решений, проверки и итоговое состояние Git."

policy:
  allow_implicit_invocation: true
