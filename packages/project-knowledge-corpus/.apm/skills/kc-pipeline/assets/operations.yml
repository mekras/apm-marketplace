# Необязательные настройки операционного контура корпуса.
# Скопируйте в проект, например в knowledge/operations.yml, и укажите путь
# параметром --operations средства run-corpus-operations.py.

operations_version: 1

transfer_policy:
  mode: apply_now # apply_now | propose_only

# In propose_only this local report is the checked hand-off for every apply_now
# finding. It must stay outside the tracked product layer.
impact_report:
  path: .local/reports/impact-findings.yml

# Required before a finding can propose or apply a product change. The consumer
# owns these mappings; a surface name alone never authorizes a path.
surface_paths:
  user_documentation: [docs/**]
  requirements: [docs/requirements.md]
  code: [src/**]

# Логические профили разрешаются только локально. Файл должен быть исключён из
# Git и не должен содержать секреты в выводе или отчёте контроллера.
access_profiles:
  path: .local/access-profiles.yml

# Отчёт описывает конкретный запуск, поэтому должен находиться вне Git.
report:
  path: .local/reports/corpus-operations.md

# Состояние полного прохода переживает отдельный сеанс агента.
run_state:
  path: .local/state/corpus-pipeline.json

# Человеку показываются группы решений, а не каждая затронутая запись.
# Полный хвост всё равно сохраняется в состоянии прохода.
human_attention:
  max_active_groups: 20

# Имена подготовленных артефактов единицы. Их наличие переводит единицу
# из очереди нормализации в очередь извлечения утверждений.
normalized_artifacts:
  - normalized.md
  - message.md
  - stenogram.txt

# Начальная конфигурация без фиктивных проектных команд.
# Заполните применимые операции проверенными исполнителями через kc-setup.
# Основания применимости и условия активации сохраняйте здесь комментариями.
# Синтаксис проектных исполнителей показан в operations.example.yml пакета.
stages: {}
adapters: {}
